properties
android.useAndroidX=true
android.enableJetifier=true
# Jetifier can't read Java 25 classes in BouncyCastle (from Robolectric), which needs no jetifying.
android.jetifier.ignorelist=bcprov
# Gradle's 512 MB default runs out during release builds (R8) and lint.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8